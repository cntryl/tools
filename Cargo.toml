[package]
name = "cntryl-tools"
version = "0.1.0"
edition = "2021"
publish = false
description = "Standalone command-line tool with child commands for cntryl"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["extra-traits", "full", "visit"] }
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
